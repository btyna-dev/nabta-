<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nabta 🌱 - خطتي</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #faf7ff;
      color: #29233d;
    }

    header {
      padding: 20px 8%;
      background: white;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 24px;
      font-weight: bold;
    }

    .container {
      max-width: 700px;
      margin: 60px auto;
      padding: 20px;
      text-align: center;
    }

    .card {
      background: white;
      padding: 30px;
      border-radius: 25px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.06);
    }

    h1 {
      font-size: 34px;
      margin-bottom: 10px;
    }

    p {
      color: #777;
      margin-bottom: 30px;
    }

    label {
      display: block;
      text-align: right;
      margin: 18px 0 8px;
      font-weight: bold;
    }

    input, select {
      width: 100%;
      box-sizing: border-box;
      padding: 14px;
      border: 1px solid #ddd;
      border-radius: 12px;
      font-size: 16px;
      background: #fff;
    }

    button {
      margin-top: 25px;
      padding: 14px 35px;
      border: none;
      border-radius: 30px;
      background: #7865df;
      color: white;
      font-size: 17px;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }

    #result {
      margin-top: 30px;
      padding: 20px;
      border-radius: 18px;
      background: #f3efff;
      display: none;
    }
  </style>
</head>

<body>

<header>
  <div class="logo">🌱 Nabta</div>
  <div>خطتي الدراسية</div>
</header>

<div class="container">

  <div class="card">

    <h1>ابدئي خطتك 🌱</h1>

    <p>
      جاوبي على الأسئلة البسيطة، ونبطة تساعدك في تنظيم رحلتك الدراسية.
    </p>

    <label>شن المادة اللي تبي تدرسيها؟</label>
    <input id="subject" type="text" placeholder="مثلاً: البرمجة">

    <label>كم ساعة تقدري تدرسي في اليوم؟</label>
    <select id="hours">
      <option value="">اختاري</option>
      <option>ساعة واحدة</option>
      <option>ساعتين</option>
      <option>3 ساعات</option>
      <option>4 ساعات أو أكثر</option>
    </select>

    <label>شن هدفك؟</label>
    <input id="goal" type="text" placeholder="مثلاً: نتعلم أساسيات البرمجة">

    <button onclick="makePlan()">أنشئ خطتي ✨</button>

    <div id="result"></div>

  </div>

</div>

<script>
function makePlan() {

  const subject = document.getElementById("subject").value;
  const hours = document.getElementById("hours").value;
  const goal = document.getElementById("goal").value;
  const result = document.getElementById("result");

  if (!subject || !hours || !goal) {
    result.style.display = "block";
    result.innerHTML = "🌱 كمّلي البيانات أولاً باش نبطة تقدر تنشئ خطتك.";
    return;
  }

  result.style.display = "block";

  result.innerHTML = `
    <h2>خطتك جاهزة 🎯</h2>
    <p>
      📚 المادة: <strong>${subject}</strong>
    </p>
    <p>
      ⏰ وقت الدراسة: <strong>${hours}</strong>
    </p>
    <p>
      🎯 هدفك: <strong>${goal}</strong>
    </p>
    <hr>
    <p>
      🌱 <strong>خطة اليوم:</strong><br>
      1️⃣ ادرسي المفهوم الأساسي لمدة 30 دقيقة.<br>
      2️⃣ طبقي اللي تعلمتيه لمدة 30 دقيقة.<br>
      3️⃣ خدي استراحة قصيرة ☕.<br>
      4️⃣ راجعي اللي تعلمتيه واكتبي أهم النقاط.
    </p>
  `;
}
</script>

</body>
</html>
