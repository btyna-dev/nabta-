<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <met.task {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px;
  margin: 8px 0;
  background: #f8f8f8;
  border-radius: 12px;
  cursor: pointer;
  transition: 0.2s;
}

.task input {
  width: 18px;
  height: 18px;
  cursor: pointer;
}

.task:has(input:checked) {
  text-decoration: line-through;
  opacity: 0.6;
}a name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nabta 🌱 - خطتي</title>

  

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #faf7ff;
      color: #29233d;
    }

    header {
      padding: 20px 8%;
      background: white;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 24px;
      font-weight: bold;
    }

    .container {
      max-width: 700px;
      margin: 60px auto;
      padding: 20px;
      text-align: center;
    }

    .card {
      background: white;
      padding: 30px;
      border-radius: 25px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.06);
    }

    h1 {
      font-size: 34px;
      margin-bottom: 10px;
    }
  
   p {
  color: #777;
  margin: 8px 0;
  line-height: 1.5;
}

    label {
      display: block;
      text-align: right;
      margin: 18px 0 8px;
      font-weight: bold;
    }

    input, select {
      width: 100%;
      box-sizing: border-box;
      padding: 14px;
      border: 1px solid #ddd;
      border-radius: 12px;
      font-size: 16px;
      background: #fff;
    }

    button {
      margin-top: 25px;
      padding: 14px 35px;
      border: none;
      border-radius: 30px;
      background: #7865df;
      color: white;
      font-size: 17px;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }

    #result {
      margin-top: 30px;
      padding: 20px;
      border-radius: 18px;
      background: #f3efff;
      display: none;
    }
.task {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px;
  margin: 8px 0;
  background: #f8f8f8;
  border-radius: 12px;
  cursor: pointer;
  transition: 0.2s;
}

.task input {
  width: 18px;
  height: 18px;
  cursor: pointer;
}

.task:has(input:checked) {
  text-decoration: line-through;
  opacity: 0.6;
}
    
  </style>
</head>

<body>

<header>
  <div class="logo">🌱 Nabta</div>
  <div>خطتي الدراسية</div>
</header>

<div class="container">

  <div class="card">

    <h1>ابدئي خطتك 🌱</h1>

    <p>
      جاوبي على الأسئلة البسيطة، ونبطة تساعدك في تنظيم رحلتك الدراسية.
    </p>

    <label>شن المادة اللي تبي تدرسيها؟</label>
    <input id="subject" type="text" placeholder="مثلاً: البرمجة">

    <label>كم ساعة تقدري تدرسي في اليوم؟</label>
    <select id="hours">
      <option value="">اختاري</option>
      <option>ساعة واحدة</option>
      <option>ساعتين</option>
      <option>3 ساعات</option>
      <option>4 ساعات أو أكثر</option>
    </select>
<label>شن مستوى دراستك؟</label>

<select id="level">
  <option value="">اختاري مستواك</option>
  <option value="beginner">مبتدئة 🌱</option>
  <option value="intermediate">متوسطة 🌿</option>
  <option value="advanced">متقدمة 🌳</option>
</select>
    <label>شن هدفك؟</label>
    <input id="goal" type="text" placeholder="مثلاً: نتعلم أساسيات البرمجة">

    <button onclick="makePlan()">أنشئ خطتي ✨</button>

    <div id="result"></div>

  </div>

</div>

<script>
function makePlan() {
  const subject = document.getElementById("subject").value.trim();
  const hours = document.getElementById("hours").value;
  const level = document.getElementById("level").value;
  const goal = document.getElementById("goal").value.trim();
  const result = document.getElementById("result");

  if (!subject || !hours || !level || !goal) {
    result.style.display = "block";
    result.innerHTML = "🌱 كمّلي البيانات أولاً باش نبطة تقدر تنشئ خطتك.";
    return;
  }

  let plan = "";
  let tasks = [];

  const isTwoHours = hours.includes("ساعتين");
  const isThreeHours = hours.includes("3") || hours.includes("ثلاث");

  if (subject.includes("برمج")) {

    if (level === "beginner") {
      plan = `
        <p>🌱 ادرسي مفهوم برمجي جديد لمدة 25 دقيقة.</p>
        <p>💻 طبقي مثالًا بسيطًا لمدة 25 دقيقة.</p>
        <p>☕ خدي استراحة قصيرة.</p>
        <p>✨ حلي تمرينًا سهلًا.</p>
      `;

      if (isTwoHours) {
        plan += `
          <p>🚀 طبقي تمرينًا ثانيًا وحاولي حله بدون مساعدة.</p>
          <p>📝 اكتبي أهم الأشياء اللي تعلمتيها.</p>
        `;
      }

      if (isThreeHours) {
        plan += `
          <p>🔥 اشتغلي على تمرين أصعب.</p>
          <p>🚀 طبقي المفهوم في مشروع صغير.</p>
        `;
      }

    } else if (level === "intermediate") {
      plan = `
        <p>🌿 راجعي مفهومًا برمجيًا لمدة 20 دقيقة.</p>
        <p>💻 طبقي تمرينًا متوسطًا.</p>
        <p>☕ خدي استراحة قصيرة.</p>
        <p>🚀 حاولي حل تمرين بدون مساعدة.</p>
      `;

      if (isTwoHours) {
        plan += `
          <p>🔥 حلي تمرينًا أكثر تحديًا.</p>
          <p>📝 راجعي الأخطاء وعدلي الحل.</p>
        `;
      }

      if (isThreeHours) {
        plan += `
          <p>🚀 طبقي المفهوم في مشروع صغير.</p>
          <p>✨ راجعي الكود وحسنيه.</p>
        `;
      }

    } else {
      plan = `
        <p>🌳 راجعي أهم المفاهيم بسرعة.</p>
        <p>🔥 اشتغلي على تمرين متقدم.</p>
        <p>☕ خدي استراحة قصيرة.</p>
        <p>🚀 طبقي ما تعلمتيه في مشروع صغير.</p>
      `;

      if (isTwoHours) {
        plan += `
          <p>🔥 حاولي تحسين المشروع وإضافة ميزة جديدة.</p>
          <p>📝 راجعي الأخطاء ونظمي الكود.</p>
        `;
      }

      if (isThreeHours) {
        plan += `
          <p>🚀 أضيفي ميزة جديدة للمشروع.</p>
          <p>✨ اختبري المشروع وحسني النتيجة.</p>
        `;
      }
    }

  } else {

    if (level === "beginner") {
      plan = `
        <p>🌱 ادرسي المفهوم الأساسي.</p>
        <p>📝 طبقي مثالًا بسيطًا.</p>
        <p>☕ خدي استراحة قصيرة.</p>
        <p>✨ راجعي أهم النقاط.</p>
      `;

    } else if (level === "intermediate") {
      plan = `
        <p>🌿 راجعي المفاهيم الأساسية.</p>
        <p>📝 طبقي تمرينًا متوسطًا.</p>
        <p>☕ خدي استراحة قصيرة.</p>
        <p>🚀 طبقي اللي تعلمتيه بدون مساعدة.</p>
      `;

    } else {
      plan = `
        <p>🌳 راجعي المفاهيم المهمة.</p>
        <p>🔥 اشتغلي على مهمة متقدمة.</p>
        <p>☕ خدي استراحة قصيرة.</p>
        <p>🚀 طبقي ما تعلمتيه في مشروع صغير.</p>
      `;
    }

    if (isTwoHours) {
      plan += `
        <p>📝 حلي تمرينًا إضافيًا.</p>
        <p>✨ راجعي أخطاءك واكتبي أهم الملاحظات.</p>
      `;
    }

    if (isThreeHours) {
      plan += `
        <p>🔥 حلي تمرينًا متقدمًا.</p>
        <p>🚀 طبقي ما تعلمتيه في مثال عملي.</p>
      `;
    }
  }

  const levelName =
    level === "beginner" ? "مبتدئة 🌱" :
    level === "intermediate" ? "متوسطة 🌿" :
    "متقدمة 🌳";

  result.style.display = "block";

  result.innerHTML = `
    <h2>خطتك جاهزة 🎯</h2>
    <p>📚 المادة: <strong>${subject}</strong></p>
    <p>⏰ وقت الدراسة: <strong>${hours}</strong></p>
    <p>📈 المستوى: <strong>${levelName}</strong></p>
    <p>🎯 هدفك: <strong>${goal}</strong></p>

    <hr>

<h3>🌱 خطة اليوم</h3>

<div id="tasks">
  ${plan.replace(/<p>/g, '<label class="task"><input type="checkbox"> ').replace(/<\/p>/g, '</label>')}
</div>
  `;
}
</script>

</body>
</html>
