<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nabta 🌱 - خطتي</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #faf7ff;
      color: #29233d;
    }

    header {
      padding: 20px 8%;
      background: white;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 24px;
      font-weight: bold;
    }

    .container {
      max-width: 700px;
      margin: 60px auto;
      padding: 20px;
      text-align: center;
    }

    .card {
      background: white;
      padding: 30px;
      border-radius: 25px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.06);
    }

    h1 {
      font-size: 34px;
      margin-bottom: 10px;
    }
  
   p {
  color: #777;
  margin: 8px 0;
  line-height: 1.5;
}

    label {
      display: block;
      text-align: right;
      margin: 18px 0 8px;
      font-weight: bold;
    }

    input, select {
      width: 100%;
      box-sizing: border-box;
      padding: 14px;
      border: 1px solid #ddd;
      border-radius: 12px;
      font-size: 16px;
      background: #fff;
    }

    button {
      margin-top: 25px;
      padding: 14px 35px;
      border: none;
      border-radius: 30px;
      background: #7865df;
      color: white;
      font-size: 17px;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }

    #result {
      margin-top: 30px;
      padding: 20px;
      border-radius: 18px;
      background: #f3efff;
      display: none;
    }
  </style>
</head>

<body>

<header>
  <div class="logo">🌱 Nabta</div>
  <div>خطتي الدراسية</div>
</header>

<div class="container">

  <div class="card">

    <h1>ابدئي خطتك 🌱</h1>

    <p>
      جاوبي على الأسئلة البسيطة، ونبطة تساعدك في تنظيم رحلتك الدراسية.
    </p>

    <label>شن المادة اللي تبي تدرسيها؟</label>
    <input id="subject" type="text" placeholder="مثلاً: البرمجة">

    <label>كم ساعة تقدري تدرسي في اليوم؟</label>
    <select id="hours">
      <option value="">اختاري</option>
      <option>ساعة واحدة</option>
      <option>ساعتين</option>
      <option>3 ساعات</option>
      <option>4 ساعات أو أكثر</option>
    </select>
<label>شن مستوى دراستك؟</label>

<select id="level">
  <option value="">اختاري مستواك</option>
  <option value="beginner">مبتدئة 🌱</option>
  <option value="intermediate">متوسطة 🌿</option>
  <option value="advanced">متقدمة 🌳</option>
</select>
    <label>شن هدفك؟</label>
    <input id="goal" type="text" placeholder="مثلاً: نتعلم أساسيات البرمجة">

    <button onclick="makePlan()">أنشئ خطتي ✨</button>

    <div id="result"></div>

  </div>

</div>

<script>
function makePlan() {
  const subject = document.getElementById("subject").value.trim();
  const hours = document.getElementById("hours").value;
  const level = document.getElementById("level").value;
  const goal = document.getElementById("goal").value.trim();
  const result = document.getElementById("result");

  if (!subject || !hours || !level || !goal) {
    result.style.display = "block";
    result.innerHTML = "🌱 كمّلي البيانات أولاً باش نبطة تقدر تنشئ خطتك.";
    return;
  }

  let plan = "";

  if (subject.includes("برمج")) {

    if (level === "beginner") {
      plan = `
        <p>🌱 تعلّمي مفهوم برمجي بسيط.</p>
        <p>💻 طبقي مثالًا صغيرًا بنفسك.</p>
        <p>☕ خدي استراحة قصيرة.</p>
        <p>✨ حلي تمرينًا سهلًا.</p>
      `;

    } else if (level === "intermediate") {
      plan = `
        <p>🌿 راجعي مفهومًا برمجيًا.</p>
        <p>💻 طبقي تمرينًا متوسطًا.</p>
        <p>☕ خدي استراحة قصيرة.</p>
        <p>🚀 حاولي حل تمرين بدون مساعدة.</p>
      `;

    } else {
      plan = `
        <p>🌳 راجعي أهم المفاهيم.</p>
        <p>🔥 اشتغلي على تمرين متقدم.</p>
        <p>☕ خدي استراحة قصيرة.</p>
        <p>🚀 طبقي ما تعلمتيه في مشروع صغير.</p>
      `;
    }

  } else {

    if (level === "beginner") {
      plan = `
        <p>🌱 ادرسي المفهوم الأساسي.</p>
        <p>📝 طبقي مثالًا بسيطًا.</p>
        <p>☕ خدي استراحة قصيرة.</p>
        <p>✨ راجعي أهم النقاط.</p>
      `;

    } else if (level === "intermediate") {
      plan = `
        <p>🌿 راجعي المفاهيم الأساسية.</p>
        <p>📝 طبقي تمرينًا متوسطًا.</p>
        <p>☕ خدي استراحة قصيرة.</p>
        <p>🚀 طبقي اللي تعلمتيه بدون مساعدة.</p>
      `;

    } else {
      plan = `
        <p>🌳 راجعي المفاهيم المهمة.</p>
        <p>🔥 اشتغلي على مهمة متقدمة.</p>
        <p>☕ خدي استراحة قصيرة.</p>
        <p>🚀 طبقي ما تعلمتيه في مشروع صغير.</p>
      `;
    }
  }

  const levelName =
    level === "beginner" ? "مبتدئة 🌱" :
    level === "intermediate" ? "متوسطة 🌿" :
    "متقدمة 🌳";

  result.style.display = "block";

  result.innerHTML = `
    <h2>خطتك جاهزة 🎯</h2>
    <p>📚 المادة: <strong>${subject}</strong></p>
    <p>⏰ وقت الدراسة: <strong>${hours}</strong></p>
    <p>📈 المستوى: <strong>${levelName}</strong></p>
    <p>🎯 هدفك: <strong>${goal}</strong></p>

    <hr>

    <h3>🌱 خطة اليوم</h3>

    ${plan}
  `;
}
  
</script>

</body>
</html>
